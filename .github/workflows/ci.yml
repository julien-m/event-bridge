# @generated by conventions-init
# Node 24 is required by the installed daemon and node:sqlite.
name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
